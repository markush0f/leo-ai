# Run with: docker compose -f docker-compose.yml -f deploy/compose.remote.yml up --build -d
services:
  ira-server:
    environment:
      IRA_COOKIE_SECURE: "true"

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      ira-server:
        condition: service_healthy
    restart: unless-stopped
