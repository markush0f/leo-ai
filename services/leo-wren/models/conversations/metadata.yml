name: conversations
table_reference:
  schema: public
  table: conversations
primary_key: id
columns:
  - name: id
    type: VARCHAR
    is_primary_key: true
    not_null: true
  - name: channel
    type: VARCHAR
    not_null: true
  - name: external_id
    type: VARCHAR
  - name: title
    type: VARCHAR
  - name: created_at
    type: TIMESTAMPTZ
    not_null: true
  - name: updated_at
    type: TIMESTAMPTZ
    not_null: true
  - name: archived_at
    type: TIMESTAMPTZ
  - name: messages
    type: messages
    relationship: conversations_messages
properties:
  description: Leo chat conversations across local, Telegram, and voice channels.
