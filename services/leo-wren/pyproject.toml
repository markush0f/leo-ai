[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leo-wren"
version = "0.1.0"
description = "Datasource-agnostic Wren AI SDK runner for Leo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PyYAML>=6,<7",
  "wren-langchain[all]==0.2.2",
]

[project.optional-dependencies]
agent = [
  "langchain-openai>=0.3,<1",
]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
leo-wren = "leo_wren.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leo_wren"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
