[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ira-realtime"
version = "0.1.0"
description = "Pipecat realtime audio service for Ira"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pipecat-ai[websocket]==1.11.0",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
tts = [
  "pocket-tts>=2.1,<3",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
ira-realtime = "ira_realtime.main:run"
ira-realtime-client = "ira_realtime.ira_client:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ira_realtime"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
