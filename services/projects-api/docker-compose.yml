services:
  projects-api:
    build: .
    ports:
      - "3200:3200"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3200
      - DATABASE_PATH=./data/projects.db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  projects-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    depends_on:
      projects-api:
        condition: service_healthy
    environment:
      - API_URL=http://projects-api:3200
      - PORT=3201
    ports:
      - "3201:3201"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3201/mcp',{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream'},body:'{}'}).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
