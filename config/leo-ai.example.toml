# Voice daemon settings. Copy to ~/.config/leo-ai/config.toml by default.
# Chat interfaces use the PostgreSQL catalog instead of this [llm] section.

[audio]
source = "@DEFAULT_SOURCE@"
sink = "@DEFAULT_SINK@"

[vad]
# Silence hangover before closing an utterance, in milliseconds.
hangover_ms = 500

[barge_in]
enabled = true
rms_threshold = 0.035

[wake]
# Reserved wake-word model path. Detection is not integrated yet;
# activate with `leo-ctl listen`, optionally through a desktop shortcut.
# model = "/home/YOU/.config/leo-ai/wake/leo.rpw"

[stt]
# Grok Speech-to-Text (XAI_API_KEY). Forwarded to the API as the language field.
language = "es"

[llm]
# grok | gpt | ollama | claude. The code default is grok (XAI_API_KEY);
# this template explicitly selects Ollama. Chat models are stored in PostgreSQL.
provider = "ollama"
# model = "grok-4.6"
system = "Eres Leo, un asistente de voz. Responde en español, breve y claro, para ser leído en voz alta."

[telegram]
# Optional: the bot reads TELEGRAM_BOT_TOKEN and TELEGRAM_ALLOW_USERS from `.env`.
# allow_users = [111]

# Chat tools: AppFlowy uses APPFLOWY_BASE_URL plus APPFLOWY_EMAIL/APPFLOWY_PASSWORD
# or APPFLOWY_ACCESS_TOKEN from the environment.
# Optional: APPFLOWY_WORKSPACE_ID, APPFLOWY_PARENT_VIEW_ID, APPFLOWY_GOTRUE_URL.
