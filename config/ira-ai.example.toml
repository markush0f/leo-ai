# Legacy voice settings map. Runtime state lives in PostgreSQL (`settings` +
# `engines`). If this file exists at ~/.config/ira-ai/config.toml and the
# database still has voice defaults, ira-daemon imports audio/VAD/STT language
# and the spoken prompt once. It does not override the catalog model.

[audio]
source = "@DEFAULT_SOURCE@"
sink = "@DEFAULT_SINK@"

[vad]
# Silence hangover before closing an utterance, in milliseconds.
hangover_ms = 500

[barge_in]
enabled = true
rms_threshold = 0.035

[wake]
# Reserved wake-word model path. Detection is not integrated yet;
# activate with `ira-ctl listen`, optionally through a desktop shortcut.
# model = "/home/YOU/.config/ira-ai/wake/ira.rpw"

[stt]
# Grok Speech-to-Text (XAI_API_KEY). Forwarded to the API as the language field.
language = "es"

[llm]
# grok | gpt | ollama | claude. The code default is grok (XAI_API_KEY);
# this template explicitly selects Ollama. Chat models are stored in PostgreSQL.
provider = "ollama"
# model = "grok-4.6"
system = "Eres Ira, un asistente de voz. Responde en español, breve y claro, para ser leído en voz alta."

# WhatsApp saliente: CALLMEBOT_PHONE y CALLMEBOT_APIKEY en `.env`.
# La tool `whatsapp_send` solo avisa a ese número. No sustituye a Telegram.
# Chat entrante: `services/ira-whatsapp` (Baileys). Sesión en WHATSAPP_AUTH_DIR.

[telegram]
# Optional: the bot reads TELEGRAM_BOT_TOKEN and TELEGRAM_ALLOW_USERS from `.env`.
# allow_users = [111]

# Chat tools: AppFlowy uses APPFLOWY_BASE_URL plus APPFLOWY_EMAIL/APPFLOWY_PASSWORD
# or APPFLOWY_ACCESS_TOKEN from the environment.
# Optional: APPFLOWY_WORKSPACE_ID, APPFLOWY_PARENT_VIEW_ID, APPFLOWY_GOTRUE_URL.
