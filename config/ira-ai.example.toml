# Voice device and engine settings. Audio/VAD/STT values are imported once by
# ira-daemon when PostgreSQL still has defaults. Assistant preferences below
# are read from ~/.ira/config.toml and can be edited in the desktop catalog.

[audio]
source = "@DEFAULT_SOURCE@"
sink = "@DEFAULT_SINK@"

[vad]
# Silence hangover before closing an utterance, in milliseconds.
hangover_ms = 500

[barge_in]
enabled = true
rms_threshold = 0.035

[wake]
# Reserved wake-word model path. Detection is not integrated yet;
# activate with `ira-ctl listen`, optionally through a desktop shortcut.
# model = "/home/YOU/.ira/wake/ira.rpw"

[stt]
# Grok Speech-to-Text (XAI_API_KEY). Forwarded to the API as the language field.
language = "es"

[llm]
# Legacy voice prompt import. Provider/model here do not override the catalog.
provider = "ollama"
# model = "grok-4.6"
system = "Eres Ira, un asistente de voz. Responde en español, breve y claro, para ser leído en voz alta."

[assistant]
# Model choices come from Models.dev; its offline cache lives in ~/.ira/models-dev.json.
# Provider catalog and credentials remain in PostgreSQL; active choice and power are preferences.
# active_provider = "codex"
# active_model = "gpt-6-luna"
# active_effort = "high" # Levels are defined by Models.dev for selected model.
# system_prompt = "Responde en español y cita fuentes recientes al buscar en internet."
web_search_enabled = true
web_search_context_size = "high" # low | medium | high

[telegram]
# Optional: the bot reads TELEGRAM_BOT_TOKEN and TELEGRAM_ALLOW_USERS from `.env`.
# allow_users = [111]

# Chat tools: AppFlowy uses APPFLOWY_BASE_URL plus APPFLOWY_EMAIL/APPFLOWY_PASSWORD
# or APPFLOWY_ACCESS_TOKEN from the environment.
# Optional: APPFLOWY_WORKSPACE_ID, APPFLOWY_PARENT_VIEW_ID, APPFLOWY_GOTRUE_URL.
