# MCP Toolbox config for custom SQL tools on this machine.
# Copy to tools.yaml and pass --config when running the local binary.
# The Compose toolbox service builds deploy/toolbox/Dockerfile with
# --prebuilt=postgres and does not mount this file.

kind: source
name: ira
type: postgres
host: 127.0.0.1
port: 5439
database: ira
user: ira
password: ira
---
kind: tool
name: list_conversations
type: postgres-sql
source: ira
description: Lista conversaciones recientes del catálogo de Ira.
statement: SELECT id, channel, title, updated_at FROM conversations ORDER BY updated_at DESC LIMIT 20;
---
kind: toolset
name: ira
tools:
  - list_conversations
