# MCP Toolbox config for custom SQL tools on this machine.
# Copy into .ira/toolbox when testing custom tools through Compose.
# Ira normally generates the files in that directory from its catalog.

kind: source
name: ira
type: postgres
host: postgres
port: 5432
database: ira
user: ira
password: ira
---
kind: tool
name: list_conversations
type: postgres-sql
source: ira
description: Lista conversaciones recientes del catálogo de Ira.
statement: SELECT id, channel, title, updated_at FROM conversations ORDER BY updated_at DESC LIMIT 20;
---
kind: toolset
name: ira
tools:
  - list_conversations
