<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ira</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ira-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: Grok's chat flow — sidebar, centered empty canvas, composer card that docks after the first turn — in Ira's voice. Dark charcoal or paper light; one accent; buttons that cannot be confused.
      OWN-WORLD: Near-black GrokNight / off-white GrokDay. Inverse filled primary (Nuevo chat, Enviar). Bordered secondary. Red danger. Magenta-violet only as accent, never a rainbow hairline.
      STORY: Ask Ira. Switch model in the bar. Open the catalog like settings. Toggle day/night in the rail.
      FIRST VIEWPORT: Sidebar + "Hola" + a floating composer. No cloud photograph.
      FORM: Grok web chat flow, user-pinned. Seed superseded.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
