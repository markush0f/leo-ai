# Dokploy: Compose type Docker Compose, path ./docker-compose.dokploy.yml
# Advanced → Isolated Deployments: ON
# Domains → service ira-gateway, container port 8790, HTTPS
# Environment (antes del primer deploy):
#   VITE_IRA_REALTIME=https://tu-dominio/realtime
#   IRA_HTTP_TOKEN=<secreto largo>
#   POSTGRES_PASSWORD=<secreto>
#   XAI_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY
# Password de la UI: archivo ../files/ira/password.hash (Argon2id) antes de arrancar.
#   printf '%s' "$IRA_PASSWORD" | cargo run --quiet -p ira-server --bin ira-password-hash
# Cambiar el dominio obliga a redeploy: VITE_IRA_REALTIME se hornea en el build.

configs:
  caddyfile:
    file: ./deploy/Caddyfile.dokploy
  postgres-init:
    file: ./deploy/postgres/init.sql

services:
  ira-data-permissions:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/toolbox && chown -R 10001:10001 /data"]
    volumes:
      - ../files/ira:/data
      - ../files/projects:/projects
    restart: "no"

  ira-server:
    build:
      context: .
      args:
        VITE_IRA_REALTIME: ${VITE_IRA_REALTIME:?Set VITE_IRA_REALTIME=https://tu-dominio/realtime}
    image: ira-ai:0.1.0
    environment:
      IRA_HTTP_BIND: 0.0.0.0:8787
      IRA_WEB_ROOT: /app/desktop/dist
      DATABASE_URL: postgres://ira:${POSTGRES_PASSWORD}@postgres:5432/ira?sslmode=disable
      IRA_DATABASE_URL: postgres://ira:${POSTGRES_PASSWORD}@postgres:5432/ira?sslmode=disable
      IRA_TOOLBOX_CONFIG_DIR: /home/ira/.ira/toolbox
      IRA_HTTP_TOKEN: ${IRA_HTTP_TOKEN:?Set IRA_HTTP_TOKEN}
      IRA_PASSWORD_HASH_FILE: /home/ira/.ira/password.hash
      IRA_MASTER_KEY: ${IRA_MASTER_KEY:-}
      IRA_COOKIE_SECURE: "true"
      MCP_TOOLBOX_URL: http://toolbox:5000
      IRA_SERVICES_PORT: "8790"
      LEO_MASTER_KEY: ${LEO_MASTER_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../files/ira:/home/ira/.ira
    depends_on:
      ira-data-permissions:
        condition: service_completed_successfully
      postgres-migrate:
        condition: service_completed_successfully
      toolbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  ira-realtime:
    build:
      context: ./services/ira-realtime
    image: ira-ai-realtime:0.1.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      IRA_REALTIME_HOST: 0.0.0.0
      IRA_REALTIME_PORT: "8765"
      IRA_REALTIME_MODE: ${IRA_REALTIME_MODE:-ira}
      IRA_REALTIME_SAMPLE_RATE: "16000"
      IRA_REALTIME_CHANNELS: "1"
      IRA_REALTIME_IRA_URL: http://ira-server:8787
      IRA_HTTP_TOKEN: ${IRA_HTTP_TOKEN:?Set IRA_HTTP_TOKEN}
      IRA_REALTIME_CONVERSATION_ID: ${IRA_REALTIME_CONVERSATION_ID:-}
      IRA_REALTIME_IRA_TIMEOUT_SECS: ${IRA_REALTIME_IRA_TIMEOUT_SECS:-120}
      IRA_REALTIME_TTS: ${IRA_REALTIME_TTS:-pocket}
      IRA_REALTIME_TTS_LANGUAGE: ${IRA_REALTIME_TTS_LANGUAGE:-spanish}
      IRA_REALTIME_TTS_VOICE: ${IRA_REALTIME_TTS_VOICE:-lola}
      IRA_REALTIME_TTS_QUANTIZE: ${IRA_REALTIME_TTS_QUANTIZE:-true}
      HF_HOME: /models/huggingface
    volumes:
      - ira-hf:/models/huggingface
    depends_on:
      ira-server:
        condition: service_healthy
    restart: unless-stopped

  ira-gateway:
    image: caddy:2-alpine
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      projects-api:
        condition: service_healthy
      projects-mcp:
        condition: service_healthy
      ira-server:
        condition: service_healthy
      ira-realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8790/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ira
    volumes:
      - ira-pg:/var/lib/postgresql/data
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ira -d ira"]
      interval: 2s
      timeout: 5s
      retries: 20

  postgres-migrate:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if PGPASSWORD="$$POSTGRES_PASSWORD" psql -h postgres -U ira -d ira -c 'SELECT 1' >/dev/null 2>&1; then
          exit 0
        fi
        export PGPASSWORD=leo
        psql -h postgres -U leo -d postgres -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE ROLE ira LOGIN SUPERUSER PASSWORD ''ira'''
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ira') \gexec
        SELECT 'ALTER DATABASE leo RENAME TO ira'
        WHERE EXISTS (SELECT FROM pg_database WHERE datname = 'leo') \gexec
        ALTER DATABASE ira OWNER TO ira;
        SQL

  toolbox:
    image: ${MCP_TOOLBOX_IMAGE:-us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.11.0}
    user: "10001:10001"
    depends_on:
      ira-data-permissions:
        condition: service_completed_successfully
      postgres-migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: ira
      POSTGRES_USER: ira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../files/ira/toolbox:/config:ro
    command:
      - --config-folder=/config
      - --poll-interval=2
      - --address=0.0.0.0
      - --allowed-hosts=127.0.0.1
      - --allowed-hosts=localhost
      - --allowed-hosts=toolbox
    healthcheck:
      test: ["CMD", "/toolbox", "--version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  projects-api:
    build: ./services/projects-api
    volumes:
      - ../files/projects:/app/data
    environment:
      PORT: "3200"
      DATABASE_PATH: ./data/projects.db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  projects-mcp:
    build:
      context: ./services/projects-api
      dockerfile: Dockerfile.mcp
    depends_on:
      projects-api:
        condition: service_healthy
    environment:
      API_URL: http://projects-api:3200
      PORT: "3201"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3201/mcp',{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream'},body:'{}'}).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  ira-pg:
  ira-hf:
