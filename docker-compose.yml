services:
  leo-realtime:
    build:
      context: ./services/leo-realtime
    image: leo-ai-realtime:0.1.0
    network_mode: host
    environment:
      LEO_REALTIME_HOST: 127.0.0.1
      LEO_REALTIME_PORT: "${LEO_REALTIME_PORT:-8765}"
      LEO_REALTIME_MODE: ${LEO_REALTIME_MODE:-leo}
      LEO_REALTIME_SAMPLE_RATE: "16000"
      LEO_REALTIME_CHANNELS: "1"
      LEO_REALTIME_LEO_URL: ${LEO_REALTIME_LEO_URL:-http://127.0.0.1:8787}
      LEO_REALTIME_CONVERSATION_ID: ${LEO_REALTIME_CONVERSATION_ID:-}
      LEO_REALTIME_LEO_TIMEOUT_SECS: ${LEO_REALTIME_LEO_TIMEOUT_SECS:-120}
    restart: unless-stopped

  colibri:
    build:
      context: .
      dockerfile: deploy/colibri/Dockerfile
    image: leo-ai-colibri:1.11.0
    environment:
      COLI_ALLOW_INSECURE_BIND: "1"
      COLI_RAM: "${COLIBRI_RAM:-16}"
    ports:
      - "127.0.0.1:${COLIBRI_PORT:-8081}:5000"
    volumes:
      - "${COLIBRI_MODEL_DIR:-${HOME}/models/olmoe-colibri}:/model"
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --model-id
      - "${COLIBRI_MODEL_ID:-olmoe}"
      - --ram
      - "${COLIBRI_RAM:-16}"
    shm_size: "2gb"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: leo
      POSTGRES_DB: leo
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - leo-pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leo -d leo"]
      interval: 2s
      timeout: 5s
      retries: 20

  toolbox:
    build:
      context: ./third_party
      dockerfile: ../deploy/toolbox/Dockerfile
    image: leo-ai-toolbox:1.11.0
    user: "${LEO_UID:-1000}:${LEO_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: leo
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: leo
    ports:
      - "127.0.0.1:5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.leo/toolbox:/config:ro
    command:
      - --config-folder=/config
      - --poll-interval=2
      - --address=0.0.0.0
      - --allowed-hosts=127.0.0.1
      - --allowed-hosts=localhost
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  leo-pg:
