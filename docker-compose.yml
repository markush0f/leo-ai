services:
  ira-realtime:
    build:
      context: ./services/ira-realtime
    image: ira-ai-realtime:0.1.0
    network_mode: host
    environment:
      IRA_REALTIME_HOST: 127.0.0.1
      IRA_REALTIME_PORT: "${IRA_REALTIME_PORT:-8765}"
      IRA_REALTIME_MODE: ${IRA_REALTIME_MODE:-ira}
      IRA_REALTIME_SAMPLE_RATE: "16000"
      IRA_REALTIME_CHANNELS: "1"
      IRA_REALTIME_IRA_URL: ${IRA_REALTIME_IRA_URL:-http://127.0.0.1:8787}
      IRA_REALTIME_CONVERSATION_ID: ${IRA_REALTIME_CONVERSATION_ID:-}
      IRA_REALTIME_IRA_TIMEOUT_SECS: ${IRA_REALTIME_IRA_TIMEOUT_SECS:-120}
      IRA_REALTIME_TTS: ${IRA_REALTIME_TTS:-pocket}
      IRA_REALTIME_TTS_LANGUAGE: ${IRA_REALTIME_TTS_LANGUAGE:-spanish}
      IRA_REALTIME_TTS_VOICE: ${IRA_REALTIME_TTS_VOICE:-lola}
      IRA_REALTIME_TTS_QUANTIZE: ${IRA_REALTIME_TTS_QUANTIZE:-true}
      HF_HOME: /models/huggingface
    volumes:
      - ira-hf:/models/huggingface
    restart: unless-stopped

  colibri:
    build:
      context: .
      dockerfile: deploy/colibri/Dockerfile
    image: ira-ai-colibri:1.11.0
    environment:
      COLI_ALLOW_INSECURE_BIND: "1"
      COLI_RAM: "${COLIBRI_RAM:-16}"
    ports:
      - "127.0.0.1:${COLIBRI_PORT:-8081}:5000"
    volumes:
      - "${COLIBRI_MODEL_DIR:-${HOME}/models/olmoe-colibri}:/model"
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --model-id
      - "${COLIBRI_MODEL_ID:-olmoe}"
      - --ram
      - "${COLIBRI_RAM:-16}"
    shm_size: "2gb"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ira
      POSTGRES_PASSWORD: ira
      POSTGRES_DB: ira
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - ira-pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ira -d ira || pg_isready -U leo -d leo"]
      interval: 2s
      timeout: 5s
      retries: 20

  postgres-migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if PGPASSWORD=ira psql -h postgres -U ira -d ira -c 'SELECT 1' >/dev/null 2>&1; then
          exit 0
        fi
        export PGPASSWORD=leo
        psql -h postgres -U leo -d postgres -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE ROLE ira LOGIN SUPERUSER PASSWORD ''ira'''
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ira') \gexec
        SELECT 'ALTER DATABASE leo RENAME TO ira'
        WHERE EXISTS (SELECT FROM pg_database WHERE datname = 'leo') \gexec
        ALTER DATABASE ira OWNER TO ira;
        SQL

  toolbox:
    image: ${MCP_TOOLBOX_IMAGE:-us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.11.0}
    user: "${IRA_UID:-1000}:${IRA_GID:-1000}"
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: ira
      POSTGRES_USER: ira
      POSTGRES_PASSWORD: ira
    ports:
      - "127.0.0.1:5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.ira/toolbox:/config:ro
    command:
      - --config-folder=/config
      - --poll-interval=2
      - --address=0.0.0.0
      - --allowed-hosts=127.0.0.1
      - --allowed-hosts=localhost
    healthcheck:
      test: ["CMD", "/toolbox", "--version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  ira-pg:
    name: "${IRA_POSTGRES_VOLUME:-leo-ai_leo-pg}"
  ira-hf:
    name: "${IRA_HF_VOLUME:-leo-ai_leo-hf}"
