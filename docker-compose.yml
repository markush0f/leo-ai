services:
  colibri:
    build:
      context: .
      dockerfile: deploy/colibri/Dockerfile
    image: leo-ai-colibri:1.11.0
    environment:
      COLI_ALLOW_INSECURE_BIND: "1"
      COLI_RAM: "${COLIBRI_RAM:-16}"
    ports:
      - "127.0.0.1:${COLIBRI_PORT:-8081}:5000"
    volumes:
      - "${COLIBRI_MODEL_DIR:-${HOME}/models/olmoe-colibri}:/model"
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --model-id
      - "${COLIBRI_MODEL_ID:-olmoe}"
      - --ram
      - "${COLIBRI_RAM:-16}"
    shm_size: "2gb"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: leo
      POSTGRES_DB: leo
    ports:
      - "5439:5432"
    volumes:
      - leo-pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leo -d leo"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  leo-pg:
