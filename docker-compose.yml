services:
  colibri:
    build:
      context: .
      dockerfile: deploy/colibri/Dockerfile
    environment:
      COLIBRI_BIND: 0.0.0.0:8080
      COLIBRI_HEALTH_ADDR: 127.0.0.1:8080
    ports:
      - "${COLIBRI_PORT:-8080}:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: leo
      POSTGRES_DB: leo
    ports:
      - "5439:5432"
    volumes:
      - leo-pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leo -d leo"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  leo-pg:
