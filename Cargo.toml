[workspace]
resolver = "3"
members = ["crates/leo-*", "crates/tools/*", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
    "process",
] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
] }
uuid = { version = "1", features = ["v4", "serde"] }
webrtc-vad = "0.4"
dirs = "6"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
leo-audio = { path = "crates/leo-audio" }
leo-llm = { path = "crates/leo-llm" }
leo-vad = { path = "crates/leo-vad" }
leo-wake = { path = "crates/leo-wake" }
leo-stt = { path = "crates/leo-stt" }
leo-tts = { path = "crates/leo-tts" }
leo-core = { path = "crates/leo-core" }
leo-engine = { path = "crates/leo-engine" }
leo-ipc = { path = "crates/leo-ipc" }
leo-store = { path = "crates/leo-store" }
leo-tools = { path = "crates/leo-tools" }
leo-tools-appflowy = { path = "crates/tools/leo-tools-appflowy" }
leo-tools-files = { path = "crates/tools/leo-tools-files" }
leo-tools-github = { path = "crates/tools/leo-tools-github" }
leo-tools-google = { path = "crates/tools/leo-tools-google" }
leo-tools-home-assistant = { path = "crates/tools/leo-tools-home-assistant" }
leo-tools-shell = { path = "crates/tools/leo-tools-shell" }
leo-tools-system = { path = "crates/tools/leo-tools-system" }
leo-tools-weather = { path = "crates/tools/leo-tools-weather" }
