[workspace]
resolver = "3"
members = ["crates/ira-*", "crates/tools/*", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
agent-code-lib = "0.30.0"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
    "process",
] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "json",
] }
uuid = { version = "1", features = ["v4", "serde"] }
webrtc-vad = "0.4"
dirs = "6"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.3"
sha2 = "0.10"
url = "2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde_yaml = "0.9"
ira-api = { path = "crates/ira-api" }
ira-audio = { path = "crates/ira-audio" }
ira-llm = { path = "crates/ira-llm" }
ira-vad = { path = "crates/ira-vad" }
ira-wake = { path = "crates/ira-wake" }
ira-stt = { path = "crates/ira-stt" }
ira-tts = { path = "crates/ira-tts" }
ira-core = { path = "crates/ira-core" }
ira-engine = { path = "crates/ira-engine" }
ira-ipc = { path = "crates/ira-ipc" }
ira-store = { path = "crates/ira-store" }
ira-tools = { path = "crates/ira-tools" }
ira-tools-appflowy = { path = "crates/tools/ira-tools-appflowy" }
ira-tools-callmebot = { path = "crates/tools/ira-tools-callmebot" }
ira-tools-db = { path = "crates/tools/ira-tools-db" }
ira-tools-files = { path = "crates/tools/ira-tools-files" }
ira-tools-github = { path = "crates/tools/ira-tools-github" }
ira-tools-google = { path = "crates/tools/ira-tools-google" }
ira-tools-home-assistant = { path = "crates/tools/ira-tools-home-assistant" }
ira-tools-shell = { path = "crates/tools/ira-tools-shell" }
ira-tools-system = { path = "crates/tools/ira-tools-system" }
ira-tools-weather = { path = "crates/tools/ira-tools-weather" }
ira-pgjson = { path = "crates/ira-pgjson" }
